                            <div class="invalid-feedback">Please enter a valid email address.</div>
                        </div>

                        <div class="col-12 mb-5 form-field">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" placeholder="Type here.." required></textarea>
                            <div class="valid-feedback">Looks great!</div>
                            <div class="invalid-feedback">Message is required</div>
                        </div>

                        <button type="submit" class="btn-solid theme-primary col-2">Submit</button>
